<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>NBA Player Stats Visualization</title>
  <script src="https://d3js.org/d3.v7.min.js"></script>
  <link rel="stylesheet" href="style.css">
</head>

<body>
  <h1>NBA Player Stats Dashboard</h1>
  <p>Explore NBA player performance by comparing Points Per Game (PPG), Field Goal Percentage (FG%), and Assists (APG).</p>

  <!-- Documentation + Video Links -->
  <div id="links">
    <a href="https://docs.google.com/document/d/14Sc1YMw1iNSdUsWxriN_acQF3azPcj37ASPVm0D9ZxY/edit?usp=sharing" target="_blank">
      📄 View Documentation
    </a>
    <a href="https://iu.zoom.us/rec/share/gJGpwz6ickWgL0z1CBY__vnKpEG4S_b8OWcmtckmzmXcBrkFvhLZpHj35OWf3phz.nw10rvyIAYZNdA4_?startTime=1764691364000
Passcode: 4bbe?#W%" target="_blank">
      🎥 Watch Demonstration Video
    </a>
  </div>

  <!-- Controls -->
  <div id="controls">
    <label for="teamSelect">Filter by Team:</label>
    <select id="teamSelect">
      <option value="All">All Teams</option>
    </select>
    <button id="resetBtn">Reset</button>
  </div>

  <!-- Tooltip -->
  <div id="tooltip" class="tooltip"></div>

  <!-- Charts -->
  <svg id="bubbleChart" width="950" height="500"></svg>
  <svg id="barChart" width="950" height="350"></svg>

  <script>
    const color = d3.scaleOrdinal(d3.schemeTableau10);

    const tooltip = d3.select("#tooltip");

    d3.csv("nba_data.csv").then(data => {
      data.forEach(d => {
        d.PPG = +d.PPG;
        d.APG = +d.APG;
        d.FGP = +d.FGP;
      });

      const teams = [...new Set(data.map(d => d.Team))];
      teams.forEach(team =>
        d3.select("#teamSelect").append("option").attr("value", team).text(team)
      );

      // --- Bubble Chart Setup ---
      const margin = {top: 40, right: 40, bottom: 60, left: 70};
      const width = 950 - margin.left - margin.right;
      const height = 500 - margin.top - margin.bottom;

      const svg1 = d3.select("#bubbleChart")
        .append("g")
        .attr("transform", `translate(${margin.left},${margin.top})`);

      const xScale = d3.scaleLinear()
        .domain([d3.min(data, d => d.PPG) - 2, d3.max(data, d => d.PPG) + 2])
        .range([0, width]);

      const yScale = d3.scaleLinear()
        .domain([d3.min(data, d => d.FGP) - 0.05, d3.max(data, d => d.FGP) + 0.05])
        .range([height, 0]);

      svg1.append("g")
        .attr("transform", `translate(0,${height})`)
        .call(d3.axisBottom(xScale));

      svg1.append("g")
        .call(d3.axisLeft(yScale).tickFormat(d3.format(".0%")));

      svg1.append("text")
        .attr("x", width / 2)
        .attr("y", height + 45)
        .attr("class", "axis-label")
        .text("Points Per Game (PPG)");

      svg1.append("text")
        .attr("transform", "rotate(-90)")
        .attr("x", -height / 2)
        .attr("y", -45)
        .attr("class", "axis-label")
        .text("Field Goal Percentage (FG%)");

      let bubbles = svg1.selectAll("circle")
        .data(data)
        .enter()
        .append("circle")
        .attr("cx", d => xScale(d.PPG))
        .attr("cy", d => yScale(d.FGP))
        .attr("r", d => d.APG * 1.5)
        .attr("fill", d => color(d.Team))
        .attr("opacity", 0.8)
        .on("mouseover", (event, d) => {
          tooltip.style("opacity", 1)
            .html(
              `<strong>${d.Player}</strong><br>
               Team: ${d.Team}<br>
               PPG: ${d.PPG}<br>
               FG%: ${(d.FGP * 100).toFixed(1)}%<br>
               APG: ${d.APG}`
            )
            .style("left", (event.pageX + 12) + "px")
            .style("top", (event.pageY - 28) + "px");
        })
        .on("mousemove", (event) => {
          tooltip.style("left", (event.pageX + 12) + "px")
                 .style("top", (event.pageY - 28) + "px");
        })
        .on("mouseout", () => {
          tooltip.style("opacity", 0);
        });

      // --- Bar Chart Setup ---
      const svg2 = d3.select("#barChart")
        .append("g")
        .attr("transform", `translate(${margin.left},${margin.top})`);

      const xBar = d3.scaleBand().range([0, width]).padding(0.3);
      const yBar = d3.scaleLinear().range([height / 1.5, 0]);

      const xAxisBar = svg2.append("g")
        .attr("transform", `translate(0,${height / 1.5})`);
      const yAxisBar = svg2.append("g");

      function drawBarChart(filteredData) {
        const teamAverages = d3.rollups(
          filteredData,
          v => d3.mean(v, d => d.PPG),
          d => d.Team
        ).map(([Team, AvgPPG]) => ({Team, AvgPPG}));

        xBar.domain(teamAverages.map(d => d.Team));
        yBar.domain([0, d3.max(teamAverages, d => d.AvgPPG)]);

        xAxisBar.call(d3.axisBottom(xBar));
        yAxisBar.call(d3.axisLeft(yBar));

        const bars = svg2.selectAll("rect").data(teamAverages, d => d.Team);

        bars.join(
          enter => enter.append("rect")
            .attr("x", d => xBar(d.Team))
            .attr("y", yBar(0))
            .attr("width", xBar.bandwidth())
            .attr("height", 0)
            .attr("fill", d => color(d.Team))
            .transition().duration(800)
            .attr("y", d => yBar(d.AvgPPG))
            .attr("height", d => height / 1.5 - yBar(d.AvgPPG)),
          update => update.transition().duration(800)
            .attr("x", d => xBar(d.Team))
            .attr("y", d => yBar(d.AvgPPG))
            .attr("height", d => height / 1.5 - yBar(d.AvgPPG)),
          exit => exit.remove()
        );
      }

      drawBarChart(data);

      // --- Filtering ---
      function updateCharts(filtered) {
        // Bubble chart
        const update = svg1.selectAll("circle").data(filtered, d => d.Player);

        update.join(
          enter => enter.append("circle")
            .attr("cx", d => xScale(d.PPG))
            .attr("cy", yScale(0))
            .attr("r", 0)
            .attr("fill", d => color(d.Team))
            .transition().duration(800)
            .attr("cy", d => yScale(d.FGP))
            .attr("r", d => d.APG * 1.5),
          update => update.transition().duration(800)
            .attr("cx", d => xScale(d.PPG))
            .attr("cy", d => yScale(d.FGP))
            .attr("r", d => d.APG * 1.5),
          exit => exit.transition().duration(500)
            .attr("r", 0)
            .remove()
        );

        // Bar chart
        drawBarChart(filtered);
      }

      d3.select("#teamSelect").on("change", function() {
        const value = this.value;
        const filtered = value === "All" ? data : data.filter(d => d.Team === value);
        updateCharts(filtered);
      });

      d3.select("#resetBtn").on("click", () => {
        d3.select("#teamSelect").property("value", "All");
        updateCharts(data);
      });
    });
  </script>

</body>
</html>
